<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소환사를 찾을 수 없습니다 — LoL Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="components.css">
  <script src="ddragon.js" defer></script>
  <script src="app-config.js" defer></script>
  <script src="i18n.js" defer></script>
  <script src="riot-id.js" defer></script>
  <script src="api-client.js" defer></script>
  <script src="layout.js" defer></script>
</head>
<body>

<div data-slot="header" data-active=""></div>

<main class="page page-narrow">
  <div class="empty-state">
    <div class="empty-state-num">404</div>
    <h1 class="empty-state-title">소환사를 찾을 수 없습니다</h1>
    <p class="empty-state-message">
      닉네임을 다시 확인해주세요. Riot ID는 '이름#태그' 형식입니다 (예: Hide on bush#KR1).
    </p>

    <div style="max-width: 480px; margin: 0 auto var(--space-5);">
      <form class="hero-search" data-component="retry-search" role="search">
        <label class="sr-only" for="retry-input">소환사 검색</label>
        <input id="retry-input" type="text" placeholder="이름#KR1" autocomplete="off">
        <button class="primary" type="submit">검색</button>
      </form>
    </div>

    <div class="empty-state-actions">
      <a href="index.html"><button type="button">홈으로</button></a>
    </div>
  </div>
</main>

<div data-slot="footer"></div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var form = document.querySelector('[data-component="retry-search"]');
    if (!form) return;
    var input = form.querySelector('#retry-input');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = (input.value || '').trim();
      if (!v) { input.focus(); return; }
      var parts = v.split('#');
      if (parts.length !== 2 || !parts[0] || !parts[1]) {
        input.setCustomValidity('형식: 이름#KR1');
        input.reportValidity();
        setTimeout(function () { input.setCustomValidity(''); }, 1500);
        return;
      }
      var region = (localStorage.getItem('lol-tracker:region') || 'kr').toLowerCase();
      window.location.href =
        'summoner.html?region=' + encodeURIComponent(region) +
        '&name=' + encodeURIComponent(parts[0]) +
        '&tag=' + encodeURIComponent(parts[1]);
    });
  });
</script>

</body>
</html>
